<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hopr – Hop Across Chains</title>
    <link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/brand/logo-mark.svg" color="#22b3a3" />
    <meta name="theme-color" content="#07080b" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #07080b;
        color: #ffffff;
      }

      html.light, html.light body {
        background-color: #f5f7fa;
        color: #0f172a;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #07080b;
        opacity: 1;
        pointer-events: auto;
        transition: opacity 180ms ease-out;
      }

      html.light #boot-splash {
        background: #f5f7fa;
      }

      html.app-ready #boot-splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      /* Resolve the theme before first paint so there is never a flash of the wrong one. */
      (function () {
        var root = document.documentElement;
        function apply(theme, preference) {
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-theme-preference", preference);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f5f7fa" : "#07080b");
        }
        var preference = "system";
        try {
          var saved = localStorage.getItem("hopr-theme-preference");
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch (e) {}
        var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        apply(preference === "system" ? system : preference, preference);

        // Embedded previews may still drive the theme from the parent frame.
        if (window.self !== window.top) {
          window.addEventListener("message", function (event) {
            var theme = event.data && event.data.theme;
            if (theme === "light" || theme === "dark") apply(theme, theme);
          });
        }
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage({
              type: "sandbox-runtime-error",
              payload: {
                message: String(event.message).slice(0, 500),
                filename: event.filename || "",
                lineno: event.lineno || 0,
                colno: event.colno || 0,
                stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
              }
            }, "*");
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
