name = "hopr"
compatibility_date = "2024-01-01"
main = "workers/index.ts"

[site]
bucket = "./dist"

[env.production]
route = "hopr-432.pages.dev/*"

[env.staging]
route = "staging.hopr.pages.dev/*"

# Variables
[vars]
ENVIRONMENT = "production"

# D1 Database (for user data, trades, wallets)
# [[d1_databases]]
# binding = "DB"
# database_name = "hopr-db"
# database_id = "your-database-id"

# KV Namespace (for caching chain detection results)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# Telegram wallet addresses and settings require a separate KV namespace.
# Create one with `npx wrangler kv namespace create TELEGRAM_STATE`, then
# uncomment these lines and replace the ID with the returned namespace ID:
# [[kv_namespaces]]
# binding = "TELEGRAM_STATE"
# id = "your-telegram-state-namespace-id"
