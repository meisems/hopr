name = "hopr"
compatibility_date = "2024-01-01"
main = "workers/index.ts"

# Secrets (never commit these; set with `npx wrangler secret put <NAME>`):
#   TELEGRAM_BOT_TOKEN       Bot API token from @BotFather
#   TELEGRAM_WEBHOOK_SECRET  Random string, also passed to setWebhook
#   ENCRYPTION_KEY           32+ random bytes; encrypts every custodial key (EVM, Solana, NEAR)
#   LIFI_API_KEY             Optional LI.FI key for higher quote limits
#   NEAR_RPC_URL             Keyed NEAR mainnet RPC (e.g. FastNEAR/Lava/Infura). Free public
#                            RPCs rate-limit quickly; they are only used as fallbacks.
#   ADMIN_TOKEN              Bearer token for the referral payout admin endpoints
#   ONECLICK_JWT             NEAR Intents 1Click API key (keeps the full app fee)
# Variables (plain vars are fine):
#   HOPR_INTENTS_FEE_ACCOUNT Hopr's NEAR fee account (NEAR Intents + Ref swap fee)
#   TELEGRAM_BOT_USERNAME    Bot username for invite links (optional; getMe is used otherwise)
#   PUBLIC_APP_URL           Dashboard URL for web invite links (optional)
#   REFERRAL_MIN_PAYOUT_USD  Minimum referral claim (default 5)
[env.production]
[env.production.vars]
ENVIRONMENT = "production"
TELEGRAM_MINI_APP_URL = "https://hopr-432.pages.dev/"
[[env.production.d1_databases]]
binding = "DB"
database_name = "hopr-db"
database_id = "2367cac7-781c-4b93-bb93-7743e1a03026"
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "973df0713fc746baa0ca71e63da25a4d"
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "c75340fc9e934d20bdf8437e4725541b"
[[env.production.kv_namespaces]]
binding = "TELEGRAM_STATE"
id = "c75340fc9e934d20bdf8437e4725541b"

[env.staging]
route = "staging.hopr.pages.dev/*"

# Variables
[vars]
ENVIRONMENT = "production"
TELEGRAM_MINI_APP_URL = "https://hopr-432.pages.dev/"

[[d1_databases]]
binding = "DB"
database_name = "hopr-db"
database_id = "2367cac7-781c-4b93-bb93-7743e1a03026"

[[kv_namespaces]]
binding = "CACHE"
id = "973df0713fc746baa0ca71e63da25a4d"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c75340fc9e934d20bdf8437e4725541b"

[[kv_namespaces]]
binding = "TELEGRAM_STATE"
id = "c75340fc9e934d20bdf8437e4725541b"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
